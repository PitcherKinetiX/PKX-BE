version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pkx-postgres
    environment:
      POSTGRES_DB: pkx_db
      POSTGRES_USER: pkx_user
      POSTGRES_PASSWORD: pkx_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pkx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkx_user -d pkx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pkx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pkx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pkx-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pkx-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client to create bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: pkx-minio-init
    depends_on:
      - minio
    networks:
      - pkx-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/pkx-videos --ignore-existing;
      mc anonymous set download myminio/pkx-videos;
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  pkx-network:
    driver: bridge
