version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pkx-backend
    ports:
      - "8080:8080"
    env_file:
      - ../env/pkx-backend.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pkx-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: pkx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pkx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local

networks:
  pkx-network:
    driver: bridge
