spring:
  application:
    name: pkx-backend

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    # Cloud SQL: RDB_URL 환경변수로 주입 (예: jdbc:mysql:///pkx_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.mysql.SocketFactory)
    # 로컬: jdbc:mysql://localhost:3306/pkx_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    url: ${RDB_URL:jdbc:mysql://localhost:3306/pkx_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${RDB_USERNAME:root}
    password: ${RDB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.pkx: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:pkx-super-secret-key-change-this-in-production-minimum-512-bits-secret-key}
  expiration: 3600000  # 1 hour
  refresh-expiration: 604800000  # 7 days

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: '*'
  exposed-headers: Authorization,Content-Disposition
  allow-credentials: true
  max-age: 3600

# GCS Configuration
gcs:
  bucket-name: ${GCS_BUCKET_NAME:pitcherkinetix1}
  project-id: ${GCP_PROJECT_ID:}

# Application Properties
app:
  storage:
    type: gcs
    upload-dir: /tmp/pkx-uploads
  analysis:
    max-video-size: 524288000  # 500MB
    allowed-extensions: mp4,mov,avi,mkv

# AI Analysis Server
ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
    timeout: 300000  # 5 minutes

# Feign Client Timeout
feign:
  client:
    config:
      ai-analysis:
        connect-timeout: 10000
        read-timeout: 300000  # 5 minutes
