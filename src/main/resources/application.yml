spring:
  application:
    name: pkx-backend

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.pkx: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# JWT Configuration
jwt:
  # HS512 requires a key size >= 512 bits (>= 64 bytes). Default value below satisfies that,
  # but in real environments you SHOULD override JWT_SECRET with a long, random value.
  secret: ${JWT_SECRET:pkx-super-secret-key-change-this-in-production-minimum-512-bits-secret-key}
  expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: '*'
  exposed-headers: Authorization,Content-Disposition
  allow-credentials: true
  max-age: 3600

# Application Properties
app:
  storage:
    type: minio  # or s3
    upload-dir: /tmp/pkx-uploads

  analysis:
    max-video-size: 524288000  # 500MB in bytes
    allowed-extensions: mp4,mov,avi,mkv
